# One-time release-note repair for v1.5.5.
name: Fix v1.5.5 release notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-v1.5.5.yml'

permissions:
  contents: write

jobs:
  release-notes:
    name: Fix release notes
    runs-on: ubuntu-24.04
    steps:
      - name: Update v1.5.5 release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<'EOF'
          # encrypted_parquet for DuckDB 1.5.5

          This release targets **DuckDB 1.5.5**.

          The Linux and Windows binaries are copied directly from the already-successful **GitHub Actions run #31**; this release does **not** rebuild them.

          Included packages:
          - `linux_amd64.tar.gz` — Linux x86_64
          - `windows_amd64.zip` — Windows x64 / MSVC
          - `SHA256SUMS.txt`

          Direct-KMS recommended key input uses `footer_key_value` with explicit `from_base64()` / `from_hex()` decoding. The legacy `footer_key` alias path remains supported.

          Source release tree: `f2a608a0c0f8fc1951e5e9d24d5ccfb83b5a8eb2`
          Build source: Action #31 (`39707881151`)

          SHA-256:
          - `linux_amd64.tar.gz`: `2a8b482cd53e16da6efa105009ad80b85d2773b76e0ce6190c906c5e6ced8478`
          - `windows_amd64.zip`: `6fb1dac76a29e0d7e6ac48aef0afe649f532356a02e35e7041a0607ab82154d2`
          EOF

          gh release edit v1.5.5 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'encrypted_parquet for DuckDB 1.5.5' \
            --notes-file RELEASE_NOTES.md
